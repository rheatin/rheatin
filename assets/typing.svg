<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 500 50'
    style='background-color: #00000000;'
    width='500px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4000ms' fill="freeze"
                    values='m0,25 h0 ; m0,25 h0 ; m0,25 h500 ; m0,25 h500' keyTimes='0;0;0.75;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#F38BA8' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            ✨ Turning ideas into reality
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d2.end'
                    dur='8000ms' fill="freeze"
                    values='m0,50 h0 ; m0,50 h0 ; m0,50 h500 ; m0,50 h500' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#F38BA8' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            🚀 Always building, always exploring
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Multiline -->
                                <animate id='d2' attributeName='d' begin='0s;d2.end'
                    dur='12000ms' fill="freeze"
                    values='m0,75 h0 ; m0,75 h0 ; m0,75 h500 ; m0,75 h500' keyTimes='0;0.66666666666667;0.91666666666667;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#F38BA8' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            🎨 Designing cool stuff with code
        </textPath>
    </text>
</svg>
